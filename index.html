                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"

                <path

                  d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
              </svg>

                Organizador
              </h1>
              <p class="text-[11px] text-[#8D6E63] font-medium tracking-wide uppercase">
                Institute Attendance
              </p>
            </div>
          </div>
          <div class="text-right">
            <p
              class="text-[10px] text-[#A1887F] font-medium uppercase tracking-wider"

            <p class="text-sm font-semibold text-[#5D4037] font-serif" id="current-date">

          </div>
        </div>
      </div>

      </section>

      <!--  -->

    <!-- Bottom Navigation -->
    <nav
      class="fixed bottom-0 left-0 right-0 z-50 bg-[#F5F0EB]/90 backdrop-blur-xl border-t border-[#D7CCC8]/40">
      <div class="max-w-md mx-auto px-6 py-2">
        <div class="flex items-center justify-around">
          <button
            class="nav-item active flex flex-col items-center gap-1 py-2.5 px-4 rounded-2xl text-[#A1887F] hover:text-[#5D4037] transition-colors"
            id="nav-list">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span class="text-[10px] font-semibold">List</span>
          </button>
          <button
            class="nav-item flex flex-col items-center gap-1 py-2.5 px-4 rounded-2xl text-[#A1887F] hover:text-[#5D4037] transition-colors"
            id="nav-edit">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            <span class="text-[10px] font-semibold">Edit</span>
          </button>
          <button
            class="nav-item flex flex-col items-center gap-1 py-2.5 px-4 rounded-2xl text-[#A1887F] hover:text-[#5D4037] transition-colors"
            id="nav-stats">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />

    <!---->
    <!-- MODAL -->

    <div
      id="studentModal"
      class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
      <div class="bg-white w-80 rounded-2xl p-5 relative">
        <button id="closeModalBtn" class="absolute top-3 right-3 text-gray-500">✕</button>

        <h2 class="text-xl font-bold text-[#5D4037] mb-4">Nuevo Alumno</h2>

        <form id="studentForm" class="flex flex-col gap-3">
          <input id="nameInput" type="text" placeholder="Nombre" class="border rounded-lg p-2" />

          <input
            id="lastnameInput"
            type="text"
            placeholder="Apellido"
            class="border rounded-lg p-2" />

          <!-- FECHAS -->
          <div>
            <p class="font-semibold text-[#5D4037] mb-2">Asistencia</p>

            <div
              id="attendanceChecklist"
              class="grid grid-cols-2 gap-2 max-h-40 overflow-y-auto"></div>
          </div>

          <button type="submit" class="bg-emerald-700 text-white rounded-lg p-2">Guardar</button>
        </form>
      </div>
    </div>
